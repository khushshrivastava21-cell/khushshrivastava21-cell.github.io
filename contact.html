<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Dev.Studio</title>
  <meta name="description" content="Start a project with a WordPress & Shopify developer." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Source+Serif+4:opsz,wght@0,8..60,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="logo">Dev<span>.</span>Studio</a>
      <nav>
        <ul class="nav-links">
          <li><a href="services.html">Services</a></li>
          <li><a href="portfolio.html">Portfolio</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <a href="audit.html" class="btn btn-primary btn-sm">Free Audit</a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <p class="eyebrow">Contact</p>
        <h1>Let's build something.</h1>
        <p class="section-lead">Tell me about your project and I'll get back to you within 24 hours.</p>

        <form class="form" action="mailto:you@example.com" method="post" enctype="text/plain">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required />
          </div>
          <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div>
            <label for="service">What do you need?</label>
            <select id="service" name="service">
              <option>WordPress Development</option>
              <option>Shopify Development</option>
              <option>Website Optimization</option>
              <option>Something else</option>
            </select>
          </div>
          <div>
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Send Message</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-bottom">
      <p>&copy; 2026 Dev.Studio. All rights reserved.</p>
      <p>Built to generate clients.</p>
    </div>
  </footer>

</body>
</html>
